name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)

          if [ -z "$latest" ]; then
            next="v0.1.0"
          elif [[ "$HEAD_REF" == feat/* ]]; then
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            next="v${major}.$((minor + 1)).0"
          elif [[ "$HEAD_REF" == fix/* || "$HEAD_REF" == bug/* ]]; then
            version="${latest#v}"
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            patch=$(echo "$version" | cut -d. -f3)
            next="v${major}.${minor}.$((patch + 1))"
          else
            echo "branch '$HEAD_REF' matches neither feat/ nor fix/|bug/ skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "computed next=$next (latest=${latest:-none} branch=$HEAD_REF)"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"
          gh release create "$NEXT" --title "$NEXT" --generate-notes
